[project]
name = "project"
version = "0.1.0"
description = "Spec-driven research project. See README.md and specs/."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spec(*ids): acceptance criteria (from specs/) that this test covers"]
